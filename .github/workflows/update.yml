name: Update site

# Code lives on main. Data (scan results, live prices, alert state) lives on the `data`
# branch, which is overwritten each run so large daily files never pile up in history.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1-5"              # fundamentals: morning pass (~6am ET)
    - cron: "17 22 * * 0-4"              # fundamentals: evening pass, keeps the rotation moving
    - cron: "7,22,37,52 13-21 * * 1-5"   # prices + buy-zone alerts during market hours
    - cron: "41 18 * * 1-5"              # option chains for the income page (~2:40pm ET, market open)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [prices, scan, fullscan, options, deploy]
        default: prices

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DATA_FILES: docs/scan.json docs/etfs.json docs/live.json docs/track.json docs/options.json docs/ivhist.json universe.json alerts_state.json alerts.log
    steps:
      - uses: actions/checkout@v4

      - name: Load data branch
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            for f in $DATA_FILES; do git show FETCH_HEAD:"$f" > "$f" 2>/dev/null || rm -f "$f"; done
            git checkout FETCH_HEAD -- docs/co 2>/dev/null && git reset -q docs/co || true  # per-company files
          fi
          ls -la docs

      - name: Decide what to run
        id: mode
        run: |
          s="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}"
          elif [ "$s" = "17 10 * * 1-5" ] || [ "$s" = "17 22 * * 0-4" ]; then m=scan
          elif [ "$s" = "41 18 * * 1-5" ]; then m=options
          elif [ "${{ github.event_name }}" = "schedule" ]; then m=prices
          else m=deploy; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "mode: $m"

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'deploy'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.mode.outputs.mode != 'deploy'
        run: pip install -r requirements.txt

      - name: Rescan fundamentals (stalest first, within budget)
        if: steps.mode.outputs.mode == 'scan' || steps.mode.outputs.mode == 'fullscan'
        run: |
          # ETFs first, before Yahoo throttles; fullscan refreshes every stock regardless of age
          python etf.py
          if [ "${{ steps.mode.outputs.mode }}" = "fullscan" ]; then python scan.py --stale-hours 0 --budget 95 || echo "scan not saved; keeping previous data"
          else python scan.py --budget 75 || echo "scan not saved; keeping previous data"; fi
          python alert.py --force --prices-only
          python track.py
          python details.py || echo "details step failed; keeping previous company files"

      - name: Scan option chains for the income page
        if: steps.mode.outputs.mode == 'options'
        run: python options.py || echo "option scan not saved; keeping previous data"

      - name: Refresh prices and send alerts
        if: steps.mode.outputs.mode == 'prices'
        run: |
          python alert.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          python track.py --prices

      - name: Save data branch
        if: steps.mode.outputs.mode != 'deploy'
        run: |
          tmp=$(mktemp -d)
          for f in $DATA_FILES; do [ -e "$f" ] && mkdir -p "$tmp/$(dirname "$f")" && cp "$f" "$tmp/$f"; done
          [ -d docs/co ] && mkdir -p "$tmp/docs" && cp -r docs/co "$tmp/docs/co"
          cd "$tmp"
          git init -q -b data
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
