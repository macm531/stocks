name: Update site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * 1-5"         # fundamentals rescan, ~7am ET weekdays
    - cron: "*/30 13-21 * * 1-5"   # prices + 52-week-low alerts, market hours
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [prices, scan, deploy]
        default: prices

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then m="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ]; then m=scan
          elif [ "${{ github.event_name }}" = "schedule" ]; then m=prices
          else m=deploy; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "mode: $m"

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.mode != 'deploy'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.mode.outputs.mode != 'deploy'
        run: pip install -r requirements.txt

      - name: Rescan fundamentals
        if: steps.mode.outputs.mode == 'scan'
        run: python scan.py && python alert.py --force --prices-only

      - name: Refresh prices and send alerts
        if: steps.mode.outputs.mode == 'prices'
        run: python alert.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit data
        if: steps.mode.outputs.mode != 'deploy'
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/scan.json docs/live.json alerts_state.json alerts.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Update data ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase -X theirs && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
